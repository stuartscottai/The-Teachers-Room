<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Word Wheel game thumbnail</title>
  <desc id="desc">Neon stage backdrop with a curved word wheel and large center letter, matching the in-game look.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040b31"/>
      <stop offset="45%" stop-color="#0a1d54"/>
      <stop offset="100%" stop-color="#1a0f4f"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#6fe7ff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#2d6fa0" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arcMain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472ff"/>
      <stop offset="50%" stop-color="#ffd24b"/>
      <stop offset="100%" stop-color="#58b9ff"/>
    </linearGradient>
    <linearGradient id="arcSecondary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#ff8cc9"/>
      <stop offset="100%" stop-color="#46d5ff"/>
    </linearGradient>
    <radialGradient id="ballSilver" cx="30%" cy="24%" r="76%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="46%" stop-color="#dfe8f4"/>
      <stop offset="100%" stop-color="#6e7e97"/>
    </radialGradient>
    <radialGradient id="ballGreen" cx="30%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#ddfff1"/>
      <stop offset="48%" stop-color="#37c997"/>
      <stop offset="100%" stop-color="#0a6b58"/>
    </radialGradient>
    <radialGradient id="ballAmber" cx="30%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#fff2be"/>
      <stop offset="48%" stop-color="#f7c948"/>
      <stop offset="100%" stop-color="#a05e00"/>
    </radialGradient>
    <radialGradient id="ballBack" cx="34%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#8ea0be"/>
      <stop offset="100%" stop-color="#2d3d5c"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="smallGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#centerGlow)"/>

  <path d="M80 560 C 260 180, 940 180, 1120 560" fill="none" stroke="url(#arcMain)" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
  <path d="M170 560 C 330 250, 870 250, 1030 560" fill="none" stroke="url(#arcSecondary)" stroke-width="10" stroke-linecap="round" opacity="0.76"/>
  <ellipse cx="600" cy="616" rx="560" ry="36" fill="#0d1f4b" opacity="0.88"/>
  <ellipse cx="600" cy="606" rx="515" ry="22" fill="#365ec6" opacity="0.24"/>

  <ellipse cx="600" cy="470" rx="248" ry="140" fill="#8adfff" opacity="0.12" filter="url(#softGlow)"/>

  <g font-family="Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#16243e">
    <g opacity="0.34">
      <circle cx="300" cy="272" r="18" fill="url(#ballBack)"/>
      <text x="300" y="279" font-size="16">L</text>
      <circle cx="378" cy="236" r="18" fill="url(#ballBack)"/>
      <text x="378" y="243" font-size="16">M</text>
      <circle cx="464" cy="216" r="18" fill="url(#ballBack)"/>
      <text x="464" y="223" font-size="16">N</text>
      <circle cx="556" cy="206" r="18" fill="url(#ballBack)"/>
      <text x="556" y="213" font-size="16">O</text>
      <circle cx="648" cy="206" r="18" fill="url(#ballBack)"/>
      <text x="648" y="213" font-size="16">P</text>
      <circle cx="736" cy="218" r="18" fill="url(#ballBack)"/>
      <text x="736" y="225" font-size="16">Q</text>
      <circle cx="820" cy="242" r="18" fill="url(#ballBack)"/>
      <text x="820" y="249" font-size="16">R</text>
      <circle cx="896" cy="280" r="18" fill="url(#ballBack)"/>
      <text x="896" y="287" font-size="16">S</text>
    </g>

    <g filter="url(#smallGlow)">
      <circle cx="272" cy="448" r="42" fill="url(#ballSilver)"/>
      <text x="272" y="463" font-size="54">W</text>

      <circle cx="350" cy="430" r="48" fill="url(#ballGreen)"/>
      <text x="350" y="446" font-size="60" fill="#effff8">X</text>

      <circle cx="440" cy="414" r="56" fill="url(#ballSilver)"/>
      <text x="440" y="433" font-size="70">Y</text>

      <circle cx="550" cy="406" r="66" fill="url(#ballSilver)"/>
      <text x="550" y="428" font-size="82">Z</text>

      <circle cx="678" cy="406" r="66" fill="url(#ballSilver)"/>
      <text x="678" y="428" font-size="82">B</text>

      <circle cx="788" cy="414" r="56" fill="url(#ballSilver)"/>
      <text x="788" y="433" font-size="70">C</text>

      <circle cx="878" cy="430" r="48" fill="url(#ballSilver)"/>
      <text x="878" y="446" font-size="60">D</text>

      <circle cx="956" cy="448" r="42" fill="url(#ballSilver)"/>
      <text x="956" y="463" font-size="54">E</text>
    </g>

    <g filter="url(#softGlow)">
      <circle cx="600" cy="418" r="86" fill="url(#ballAmber)" stroke="#ffd54f" stroke-width="6"/>
      <ellipse cx="574" cy="380" rx="28" ry="18" fill="#ffffff" opacity="0.38"/>
      <text x="600" y="446" font-size="114" fill="#122443">A</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="600" y="96" fill="#d7efff" font-size="56" font-weight="900" letter-spacing="2">WORD WHEEL</text>
    <text x="600" y="132" fill="#a4c9ff" font-size="23" font-weight="700" letter-spacing="1">LETTER-BY-LETTER CLUE RACE</text>
  </g>
</svg>
