    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>
      @font-face {
        font-family: 'Schoolbell';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/assets/fonts/Schoolbell-Regular.ttf') format('truetype');
      }

      :root {
        --app-vh: 1vh;
      }

      html, body {
        height: auto;
        min-height: calc(var(--app-vh, 1vh) * 100);
      }

      body {
        background-color: #f8fafc;
        color: #334155;
      }

      #root {
        height: auto;
        min-height: calc(var(--app-vh, 1vh) * 100);
      }

      .h-screen {
        height: calc(var(--app-vh, 1vh) * 100) !important;
      }

      .min-h-screen {
        min-height: calc(var(--app-vh, 1vh) * 100) !important;
      }

      body.gameplay-active footer {
        display: none !important;
      }
      /* Hide scrollbar for carousel but allow scroll */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none; 
        scrollbar-width: none;  
      }

      @media print {
        @page {
          margin: 1.5cm;
          size: auto;
        }

        /* Reset main containers to allow flow */
        body, html, #root, main {
          background-color: white !important;
          height: auto !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
          position: static !important;
        }

        /* Hide non-printable interface elements */
        nav, footer, .no-print, .no-print-inside, button {
            display: none !important;
        }

        /* Explicitly hide any element with the tailwind print:hidden class (backup) */
        .print\:hidden {
          display: none !important;
        }
        
        /* Target the printable content directly */
        #printable-area {
          display: block !important;
          width: 100% !important;
          max-width: none !important;
          margin: 0 !important;
          padding: 0 !important;
          color: black !important;
          background: white !important;
          box-shadow: none !important;
          border: none !important;
          position: relative !important;
          left: auto !important;
          top: auto !important;
        }

        /* Ensure Typography plugin doesn't constrain width */
        .prose {
          max-width: none !important;
        }

        /* Clean up borders and backgrounds for print economy */
        * {
          -webkit-print-color-adjust: exact !important; 
          print-color-adjust: exact !important; 
        }
        
        /* Force page break utilities */
        .page-break { 
          page-break-before: always; 
          break-before: page;
          display: block;
          margin-top: 2rem;
        }
        
        /* Avoid breaking inside elements */
        tr, img, .avoid-break {
          page-break-inside: avoid;
        }
        h1, h2, h3, h4 {
          page-break-after: avoid;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

  </body>
