    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Teachers' Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Quicksand', 'sans-serif'],
              display: ['Fredoka', 'sans-serif'],
            },
            colors: {
              brand: {
                blue: '#0EA5E9', // Vibrant Sky Blue (500)
                yellow: '#FACC15', // Vibrant Sunflower Yellow (400)
                dark: '#0F172A', // Slate 900
                accent: '#FB923C', // Orange 400
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #f8fafc;
        color: #334155;
      }
      /* Hide scrollbar for carousel but allow scroll */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none; 
        scrollbar-width: none;  
      }
      
      @media print {
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        body {
          background-color: white;
          -webkit-print-color-adjust: exact;
        }
        /* Force page break */
        .page-break { 
          page-break-before: always; 
          break-before: page;
          display: block;
          margin-top: 2rem;
        }
      }
    </style>
