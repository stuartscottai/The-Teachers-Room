<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Teachers' Room</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Quicksand', 'sans-serif'],
              display: ['Fredoka', 'sans-serif'],
            },
            colors: {
              brand: {
                blue: '#0EA5E9', // Vibrant Sky Blue (500)
                yellow: '#FACC15', // Vibrant Sunflower Yellow (400)
                dark: '#0F172A', // Slate 900
                accent: '#FB923C', // Orange 400
              }
            },
            animation: {
                'pop': 'pop 0.3s ease-in-out',
                'fade-in': 'fadeIn 0.5s ease-out forwards',
                'slide-up': 'slideUp 0.5s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #f8fafc;
        color: #334155;
      }
      /* Hide scrollbar for carousel but allow scroll */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none; 
        scrollbar-width: none;  
      }

      /* Custom Pop Animation */
      @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      
      @media print {
        @page {
          margin: 1.5cm;
          size: auto;
        }

        /* Reset main containers to allow flow */
        body, html, #root, main {
          background-color: white !important;
          height: auto !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
          position: static !important;
        }

        /* Hide non-printable interface elements */
        nav, footer, .no-print, .no-print-inside, button {
            display: none !important;
        }

        /* Explicitly hide any element with the tailwind print:hidden class (backup) */
        .print\:hidden {
          display: none !important;
        }
        
        /* Target the printable content directly */
        #printable-area {
          display: block !important;
          width: 100% !important;
          max-width: none !important;
          margin: 0 !important;
          padding: 0 !important;
          color: black !important;
          background: white !important;
          box-shadow: none !important;
          border: none !important;
          position: relative !important;
          left: auto !important;
          top: auto !important;
        }

        /* Ensure Typography plugin doesn't constrain width */
        .prose {
          max-width: none !important;
        }

        /* Clean up borders and backgrounds for print economy */
        * {
          -webkit-print-color-adjust: exact !important; 
          print-color-adjust: exact !important; 
        }
        
        /* Force page break utilities */
        .page-break { 
          page-break-before: always; 
          break-before: page;
          display: block;
          margin-top: 2rem;
        }
        
        /* Avoid breaking inside elements */
        tr, img, .avoid-break {
          page-break-inside: avoid;
        }
        h1, h2, h3, h4 {
          page-break-after: avoid;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@18.3.1/",
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",

    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://esm.sh/lucide-react@0.300.0?external=react",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?external=react,react-dom",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "three": "https://esm.sh/three@0.168.0",
    "three-stdlib": "https://esm.sh/three-stdlib@2.30.4?external=three,react,react-dom",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.17.6?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.112.0?external=react,react-dom,three,@react-three/fiber",
    "maath": "https://esm.sh/maath@0.10.8?external=three"
  }
}
</script>
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>

</html>
